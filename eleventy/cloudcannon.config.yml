# yaml-language-server: $schema=https://github.com/cloudcannon/configuration-types/releases/latest/download/cloudcannon-config.latest.schema.json
collections_config:
  pages:
    path: src
    glob:
      - "index.md"
    url: /
  # The key must match the Eleventy collection name: the editor resolves
  # `collections.posts` through `CloudCannon.collection("posts")`.
  posts:
    path: src/posts
    glob:
      - "*.md"
    url: "/posts/[slug]/"
    _enabled_editors:
      - visual
      - content
      - data
